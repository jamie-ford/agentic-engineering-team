[project]
name = "claude-agent-tui"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
    "mcp[cli]>=1.0",
]

[project.scripts]
claude-tui = "claude_agent_tui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_agent_tui"]
